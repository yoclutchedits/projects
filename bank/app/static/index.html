<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="layout">
  <div class="brand-panel">
    <div class="brand-mark">Ledger</div>
    <div class="brand-tagline">A banking system built to show its work.</div>
  </div>

  <div class="form-panel">
    <div class="form-container">
      <div class="tabs">
        <button class="tab active" data-tab="login">Sign in</button>
        <button class="tab" data-tab="register">Create account</button>
      </div>

      <div id="message-box"></div>

      <div id="login-step-1">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your account</p>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Your password">
        </div>
        <button class="primary" id="login-btn">Sign in</button>
      </div>

      <div id="register-step-1" class="hidden">
        <h1>Create your account</h1>
        <p class="subtitle">Start managing your money</p>
        <div class="field">
          <label for="register-name">Full name</label>
          <input type="text" id="register-name" placeholder="Your name">
        </div>
        <div class="field">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" placeholder="Create a password">
        </div>
        <button class="primary" id="register-btn">Create account</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/index.js"></script>
</body>
</html>
